"$schema" = "./node_modules/wrangler/config-schema.json"
name = "knp-birds"
main = "src/worker.js"
account_id = "fd74641e5d61594bd1580237979194aa"
compatibility_date = "2026-10-30"
# agents/mcp/server imports node:async_hooks. The Agents SDK documents this flag.
compatibility_flags = ["nodejs_compat"]
# npm packages (agents, the MCP server, zod) are bare specifiers. no_bundle
# uploads only project files, so the Worker is bundled and those imports resolve.
no_bundle = false

# The browser scripts are imported as text so esbuild does not rewrite them.
# keepNames would otherwise inject an __name helper into the served files.
[[rules]]
type = "Text"
globs = ["**/client/*.js"]
fallthrough = false

[[rules]]
type = "ESModule"
globs = ["**/*.js"]
fallthrough = true

# Workers Caching sits in front of the Worker and honours Cache-Control.
[cache]
enabled = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true

[[kv_namespaces]]
binding = "BIRDS_KV"
id = "d241348305f646e29c30880c361f6bf6"

# Included in the Cache API key so a code deploy does not reuse a rendered page.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "knp-birds-images"

[[routes]]
pattern = "birds.truter.world"
custom_domain = true
